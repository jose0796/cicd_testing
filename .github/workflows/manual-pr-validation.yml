name: Build and test on demand

# Triggered by a repository owner, member, or collaborator commenting exactly
# 'run-tests' on a pull request. Reports the result as the 'manual/run-tests'
# commit status on the PR head commit, so it can be configured as a required
# status check for merging.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: run-tests-pr-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  build-and-test:
    if: >-
      github.event.issue.pull_request != null &&
      github.event.comment.body == 'run-tests' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PR_NUMBER: ${{ github.event.issue.number }}
      STATUS_CONTEXT: manual/run-tests
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Resolve PR head commit
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PR_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          HEAD_SHA="$(jq -r '.head.sha' <<< "${PR_JSON}")"
          HEAD_REPO="$(jq -r '.head.repo.full_name' <<< "${PR_JSON}")"
          PR_STATE="$(jq -r '.state' <<< "${PR_JSON}")"

          if [[ "${PR_STATE}" != "open" ]]; then
            echo "::error::PR #${PR_NUMBER} is not open."
            exit 1
          fi

          # Do not run code from forks with a token that can write statuses.
          if [[ "${HEAD_REPO}" != "${GITHUB_REPOSITORY}" ]]; then
            echo "::error::'run-tests' is only supported on same-repository branches, not forks."
            exit 1
          fi

          echo "head-sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"

      - name: Mark commit status as pending
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr.outputs.head-sha }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state='pending' \
            -f context="${STATUS_CONTEXT}" \
            -f description='Build and tests running' \
            -f target_url="${RUN_URL}" >/dev/null

      - name: Checkout PR head commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ steps.pr.outputs.head-sha }}
          # Do not leave the token in .git/config where PR build scripts could read it.
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      # No token in the environment: this step runs code controlled by the PR branch.
      - name: Build and run unit tests
        run: ./gradlew assembleDebug testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

      - name: Report final commit status
        if: always() && steps.pr.outputs.head-sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr.outputs.head-sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [[ "${JOB_STATUS}" == "success" ]]; then
            STATE='success'
            DESCRIPTION='Build and tests passed'
          else
            STATE='failure'
            DESCRIPTION='Build or tests failed'
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="${STATE}" \
            -f context="${STATUS_CONTEXT}" \
            -f description="${DESCRIPTION}" \
            -f target_url="${RUN_URL}" >/dev/null